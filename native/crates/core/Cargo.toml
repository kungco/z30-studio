[package]
name = "z30-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.23"
thiserror = "2"
tempfile = "3"
bytemuck = "1"
lcms2 = { version = "=6.2.0", features = ["static"] }
png = "0.18"
kamadak-exif = "=0.6.1"
mozjpeg = { version = "=0.10.13", default-features = false }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[build-dependencies]
cc = "1"

[dev-dependencies]
tiff = "0.11"
