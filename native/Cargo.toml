[workspace]
members = ["crates/core", "crates/desktop", "crates/vision"]
exclude = ["vendor/slint-winit"]
resolver = "2"

[patch.crates-io]
# Published 1.18.1 plus pinned upstream Windows invalidation fix #13568.
i-slint-backend-winit = { path = "vendor/slint-winit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
